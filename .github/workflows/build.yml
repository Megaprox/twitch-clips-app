name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twitch-clips-app.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          rm -rf proyecto
          mkdir proyecto
          unzip -o twitch-clips-app.zip -d proyecto
          echo "=== Archivos encontrados ==="
          find proyecto -maxdepth 5 -type f | head -100

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: proyecto
        run: |
          gradle assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=ignore

      - name: Buscar APK
        run: |
          echo "=== APK generados ==="
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Clips-APK
          path: proyecto/app/build/outputs/apk/**/*.apk
