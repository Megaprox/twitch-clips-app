name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twitch-clips-app.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -o twitch-clips-app.zip -d proyecto
          find proyecto -maxdepth 3 -type f | head -50

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Corregir compatibilidad Kotlin/Java
        working-directory: proyecto
        run: |
          find . -name "*.gradle" -o -name "*.gradle.kts"

      - name: Compilar APK
        working-directory: proyecto
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Clips-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
